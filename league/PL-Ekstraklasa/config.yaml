  - xG era: stats-feed expected_goals begins in 2023/2024 and shotmap xG is usable only in the 2025/2026 era; xGOT is era-guarded and fails its reliability/design conditions.
  - Calibration is defined everywhere as actual minus predicted, per the Stage 1 brief.
