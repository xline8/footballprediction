  - Team identity is by FotMob team_id; four ids carry spelling variants.
  - xG and xG split stats begin in 2022/2023; 2021/2022 uses goals-only X1 fallback and no X3/X4.
  - Halves constants use complete-splits DEV seasons 2023/2024 + 2024/2025 only.
  - Cards target is stats-feed yellow_cards with a frozen broken-stats event fallback (stats 0-0 contradicted by events -> events; 47 rows, 43 in 2021/2022); the dev-only agreement check (exact 84.9%, stats lower 14.4%, mean -0.241) and event audit columns are in eda_numbers.json.
  - xGOT is near-universal from 2024/2025; X6 is era-guarded and its reliability is recorded before adoption.
  - No model fitting or virgin reads occur in phase 1.
