  - Referee name empty in all of 2021/2022-2024/2025, 197/296 named in 2025/2026 -> X8 impossible on the dev era.
  - Cards target would have been EVENT-derived unified yellows (stats card keys exist only 2025/2026+). Stats-vs-events check 2025/2026 (inventory only): exact agreement 72.6%, mean stats-events -0.432 per match, stats never exceeds events.
  - Team-name stability: 27 FotMob team ids in the corpus (25 in dev+virgin); 7 ids carry two name spellings (diacritic variants across eras). All logic keyed by team id.
  - Awarded match 4271663 (2023/2024): FT score authoritative (awarded 0-3), fitted/scored; excluded from halves measurement only.
  - Goals levels per match: 2.563 / 2.430 / 2.770 / 2.882 (dev), 2.662 (virgin, inventory only — never used for fitting or gating), 2.587 (reserve, untouched).
  - Predictions-only: no RS odds/settlement source in-system.
