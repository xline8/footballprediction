notes:
  phase_rule: >-
    playoff iff matchRound contains (case-insensitive) quadrangular or final,
    OR general.leagueName contains Second stage, Second Stage, Super Final,
    Final Stage, or Fase Final; otherwise regular.
  stats_era: stats begin 2025-07-04; 2025 has 117 and 2026 has 226 stats matches.
  cards: use stats yellow_cards for K; event cards are audit-only because pre-2026 events are broken and 2026 overcounts.
  xg: no non-empty shotmaps and no expected_goals key; goals-only fallback.
  drops: X8 referee reliability and X2 second-tier prior are not runnable; X1 is degraded and X3/X4/X6 impossible.
  awarded: 3575291 and 1000018666 use score-based goals; first-half goals are missing.
  in_progress: 2026 runs through 2026-11-08; remaining Clausura Quadrangular round 6, Clausura Final, and Super Final are pending.
  naming: 2026 uses two disjoint leagueName variants for the same league id; do not split the competition.
