# ES-LaLiga2 (Spain) — league config
league: ES-LaLiga2
country: Spain
fotmob_id: 140
tier: 2
warehouse: data_enrichment/fotmob_world/Spain/LaLiga2
data:
  matches: league/ES-LaLiga2/data/es_matches.csv
  team_matches: league/ES-LaLiga2/data/es_team_matches.csv
seasons: ["2021/2022", "2022/2023", "2023/2024", "2024/2025", "2025/2026", "2026/2027"]
dev_period: ["2021/2022", "2022/2023", "2023/2024", "2024/2025"]  # walk-forward, season-blocked
virgin_primary: "2025/2026"        # complete season, n=468 — read ONCE per candidate
virgin_confirmatory: "2026/2027"   # partial (138 played at pull); reserved, NOT read in this build
halves_constants:                  # frozen, measured on the complete-splits era 2023/2024–2025/2026
  goals_1h_share: 0.4322
  sot_1h_share: 0.4491
  corners_1h_share: 0.4692
  total_shots_1h_share: 0.4522
  yellow_cards_1h_share: 0.3455
markets:
  goals: G-ES      # DC reference, GOALS-ONLY (xG era starts inside the virgin); arms: Gate Zero, SHRINK, X2 mover tier offset (LaLiga/Primera Federación both in warehouse)
  sot: S-ES        # v5 reference; arms: Gate Zero, RS ratio-shrink (X4/X6 era-dead — shotmap/xG exist only from 2025/2026)
  corners: C-ES    # corners_v3 reference; arms: Gate Zero (X9), X7 box touches
  cards: K-ES      # cards reference; arms: Gate Zero only (X8 referee DROPPED, dev r=0.180); target = EVENT-feed yellows (stats feed undercounts, measured)
  total_shots: T-ES # shots family; arms: A v1 pattern, B v2 level layer, C E9 trailing-r
notes:
  - 22 teams, 42 rounds, double round-robin = 462 regular matches/season + 6 promotion play-off matches (two-legged semis matchRound '1/2' x4 + final x2, phase='playoff', included as ordinary rows, no phase feature). Every complete season in the warehouse holds all 468 — no gap.
  - Heavy churn: exactly 7 of 22 clubs change every season (3 relegated from LaLiga, 4 promoted from Primera Federación, mirrored exits; verified by team_id). 42 distinct clubs across the corpus. Movers measured: ex-LaLiga clubs enter at GD +0.25/match, ex-PrimeraFed at -0.14 — the X2 mover offset is a first-class feature here.
  - Team identity is keyed on FotMob team_id everywhere: 10 of the 42 ids carry two name spellings across seasons (accents dropped in some payloads, e.g. 'Cadiz'/'Cádiz'); raw-name set arithmetic invents phantom clubs. Spellings map 1:1 onto ids, so accent-normalised name matching is exact for index-based mover membership.
  - xG/shotmap era starts 2025/2026 (the virgin): expected_goals in 1/468, 3/468, 0/468, 3/468 dev-season matches vs 468/468 in 2025/2026. No xG arm is honestly dev-testable — goals runs goals-only and S-ES runs without X4/X6.
  - Cards: stats-feed yellow_cards undercounts the event feed in every dev season (-11.8% to -2.5%; 51 complete (0,0) dropouts in 2021/2022). Unified target = event-feed Yellow events (YellowRed/Red are reds), cards_source='events' for all rows — the AR precedent.
  - Per-half stats: 0.2% in 2021/2022, 24.1% in 2022/2023, 100% from 2023/2024. Referee coverage 48.5% in 2021/2022, ~99% in 2022/2023–2024/2025, 82.1% in the virgin; strictness reliability r=0.180 (dev) = noise.
  - The virgin season ran hot on every count market (OU2.5 50.2% vs dev 40.0%; SOT over-7.5 60.5% vs 49.1%; shots over-23.5 59.2% vs 48.1%) — the calibration legs judge the arms against it as it is.
  - Predictions-only: no ES-LaLiga2 odds/settlement source in-system.
