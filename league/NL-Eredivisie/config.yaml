# NL Eredivisie (Netherlands) — league config
league: NL-Eredivisie
country: Netherlands
fotmob_id: 57
tier: 1
warehouse: data_enrichment/fotmob_world/Netherlands/Eredivisie
data:
  matches: league/NL-Eredivisie/data/nl_matches.csv
  team_matches: league/NL-Eredivisie/data/team_matches.csv
seasons: ["2021/2022", "2022/2023", "2023/2024", "2024/2025", "2025/2026", "2026/2027"]
dev_period: ["2021/2022", "2022/2023", "2023/2024", "2024/2025"]   # 2021/2022 = training/warm-up; scored dev = 2022/2023–2024/2025
virgin_primary: "2025/2026"          # complete season, n=306 — read ONCE per candidate
virgin_confirmatory: "2026/2027"     # partial (n=108, through 2026-11-08); reserved, evaluated once when complete
halves_constants:               # frozen league constants (EDA F3) — the ONLY halves mechanism
  goals_1h_share: 0.444
  sot_1h_share: 0.446
  corners_1h_share: 0.462
  total_shots_1h_share: 0.449
  yellow_cards_1h_share: 0.333
markets:
  goals: G-NL        # DC reference; arms: Gate Zero, X2 newcomer priors, X3 set-play decomposition
  sot: S-NL          # v5 reference; arms: Gate Zero, RS ratio-shrink, X4 xG/shot, X6 xGOT (era 2024/2025+)
  corners: C-NL      # corners_v3 reference; arms: Gate Zero (X9), X7 box touches
  cards: K-NL        # cards reference; arms: Gate Zero, X8 referee covariate
  total_shots: T-NL  # shots family; arms: A v1 pattern, B v2 level layer, C E9 trailing-r
notes:
  - Regular season only: 21 ECL-playoff matches in the warehouse folders are excluded by design (general.leagueName != "Eredivisie").
  - xG and shotmap are 100% in every season; period splits complete from 2023/2024 (halves grading era).
  - Every product presents FT + 1H/2H via the frozen constants above.
  - Predictions-only: no Eredivisie odds/settlement source in-system.
