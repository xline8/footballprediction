notes:
  - REGIME BREAK at 2023/2024 (foreign-star influx): goals 2.677 -> 2.959/match, team GD spread SD 0.663 -> 0.896, home edge +0.269 -> +0.175. Dev is scored on post-break seasons only; pre-break data enters fits decayed, never scored.
  - Shotmap + stats-feed xG era starts 2023/2024 (100%); pre-break coverage 2.5%/13.3%. xGOT population era starts 2024/2025 (99.4%+ of shots).
  - 16 teams through 2022/2023, 18 from 2023/2024; plain double round-robin, no split/playoffs in any season.
  - Cards: stats feed undercounts the event feed in every dev-era season (mean -0.85/-0.24/-0.15/-0.13 per match) — unified target is the EVENT feed (Yellow + YellowRed), AR/BR/NO precedent, decided on dev-era evidence only.
  - Team trait stability across the break is high (shots-for r=0.922, SOT 0.871, goals-for 0.779 over 16 ever-present clubs): the break is a level shift + widened spread, not a reshuffle.
  - Predictions-only: no SA odds/settlement source in-system.
