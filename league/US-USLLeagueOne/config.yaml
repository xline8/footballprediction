  - Box-touch coverage ramps from 30.5% in 2023 to 100% in 2025; X7 uses min-8 trailing with Gate Zero fallback.
  - Referee strictness evidence is r=0.379 at the >=10-match threshold; missing referees use Gate Zero with no imputation.
  - 2026 is transitional/reserved inventory: regular season ended 2026-10-25, semi-finals are in the feed, and the final is absent.
  - Cards dev is 2023-2024 valid rows with a cold start at the 2023 opener; virgin primary is 2025 and confirmatory is 2026.
