# NO-OBOSLigaen (Norway, 1. divisjon) — league config
league: NO-OBOSLigaen
country: Norway
fotmob_id: 203
tier: 2
warehouse: data_enrichment/fotmob_world/Norway/OBOS-ligaen
data:
  matches: league/NO-OBOSLigaen/data/no_obos_matches.csv
  team_matches: league/NO-OBOSLigaen/data/no_obos_team_matches.csv
seasons: ["2021", "2022", "2023", "2024", "2025", "2026"]
warmup_period: ["2021"]          # warm-up / initial training, never scored
dev_period: ["2022", "2023", "2024", "2025"]   # scored dev walk-forward
virgin_primary: "2026"           # complete regular season, n=240 — read ONCE per candidate
halves_constants:                # frozen league constants (EDA F3, event times) — the ONLY halves mechanism
  goals_1h_share: 0.440
  yellow_cards_1h_share: 0.306
  sot_1h_share: null             # no halves source exists (no period splits, no events) — FT-only
  corners_1h_share: null         # FT-only
  total_shots_1h_share: null     # FT-only
markets:
  goals: G-NO-OBOS        # DC goals-only; arms: Gate Zero, SHR shrinkage, X2 mover offset (Eliteserien entrants)
  sot: S-NO-OBOS          # v5 reference; arms: Gate Zero, RS ratio-shrink (no X4/X6 — no shotmap)
  corners: C-NO-OBOS      # corners_v3 pattern, possession-only multiplier; arms: Gate Zero, PLAIN ablation; primary line 10.5
  cards: K-NO-OBOS        # cards reference, event-unified target; arms: Gate Zero, X8 referee (r=0.715); primary line 3.5
  total_shots: T-NO-OBOS  # shots family; primary line 20.5; arms: A (v1 pattern), C (E9 trailing-r)
notes:
  - Format: 16 teams, single double round-robin (rounds 1-30), calendar-year season (Apr/May–Nov); the promotion/relegation play-offs are a separate FotMob competition and appear in NO season of this league_id — every corpus match is regular-season.
  - Virgin 2026 is a COMPLETE regular season (240/240 finished, last match 2026-11-08), not a transitional window.
  - Stats feed is thin: Periods.All only, four keys (BallPossesion, ShotsOnTarget, corners, total_shots); no xG, no shotmap, no period splits anywhere. 2021 stats exist only from ~round 14 (136/240 matches carry the keys).
  - Cards target is EVENT-unified (Yellow + YellowRed events): the stats feed carries no yellow_cards key at all, so no stats target exists; reds excluded.
  - Stats-feed counting regime jumped in 2024 (SOT 7.40 in 2023 → 11.85 in 2024; total shots 19.2 → 23.9) — a feed change, recorded not corrected; SOT/total-shots dev spans both regimes.
  - Virgin 2026 ran hot on goals (3.79/match vs dev 3.11) — descriptive fact, gates judge.
  - X2 mover offset is scoped to Eliteserien-relegated entrants only (parent corpus exists, F4); entrants from 2. divisjon have no parent corpus and take the league-mean prior + SHR.
  - Predictions-only: no NO-OBOSLigaen odds/settlement source in-system.
