# SCO-Premiership (Scotland) — league config
league: SCO-Premiership
country: Scotland
fotmob_id: 64
tier: 1
warehouse: data_enrichment/fotmob_world/Scotland/Premiership
data:
  matches: league/SCO-Premiership/data/sco_matches.csv
  team_matches: league/SCO-Premiership/data/sco_team_matches.csv
seasons: ["2021/2022", "2022/2023", "2023/2024", "2024/2025", "2025/2026", "2026/2027"]
dev_period: ["2021/2022", "2022/2023", "2023/2024", "2024/2025"]  # walk-forward, season-blocked
virgin_primary: "2025/2026"        # complete season, n=228 — read ONCE per candidate
virgin_confirmatory: "2026/2027"   # partial (75 played at pull); reserved, NOT read in this build
halves_constants:                  # frozen, measured on the complete-splits era 2023/2024–2025/2026 (n=684)
  goals_1h_share: 0.4405
  sot_1h_share: 0.4492
  corners_1h_share: 0.4704
  total_shots_1h_share: 0.4582
  yellow_cards_1h_share: 0.3120
markets:
  goals: G-SCO        # DC reference; arms: Gate Zero, SHRINK (thin-data prior), X3 set-play
  sot: S-SCO          # v5 reference; arms: Gate Zero, RS ratio-shrink, X4 xG/shot (X6 era starts inside virgin — not run)
  corners: C-SCO      # corners_v3 reference; arms: Gate Zero (X9), X7 box touches
  cards: K-SCO        # cards reference; arms: Gate Zero only (X8 referee DROPPED, r=0.158)
  total_shots: T-SCO  # shots family; arms: A v1 pattern, B v2 level layer, C E9 trailing-r
notes:
  - 12-team league: rounds 1-33 regular season (triple round-robin, 198 matches), rounds 34-38 split (top/bottom 6, 30 matches) = 228/season. Split rounds are modelled as ordinary league matches (points carry over; same teams); phase flag = round >= 34.
  - Old Firm dominance is extreme (career GD/match: Celtic +1.73, Rangers +1.21, next +0.35) — trait reliabilities are correspondingly high; no rating clamping anywhere.
  - Per-half stats absent in 2021/2022, 30.7% in 2022/2023, complete from 2023/2024.
  - xGOT population era starts 2024/2025 (~94% of shots); referee coverage 47.4% in 2021/2022, ~100% after, but referee strictness reliability is noise (r=0.158).
  - Predictions-only: no SCO odds/settlement source in-system.
