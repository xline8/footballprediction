  team_matches: league/DE-2Bundesliga/data/de2_team_matches.csv
seasons: ["2021/2022", "2022/2023", "2023/2024", "2024/2025", "2025/2026", "2026/2027"]
dev_period: ["2021/2022", "2022/2023", "2023/2024", "2024/2025"]  # walk-forward, season-blocked
virgin_primary: "2025/2026"        # complete season, n=306 — read ONCE per candidate
virgin_confirmatory: "2026/2027"   # partial (99 played at pull); reserved, NOT read in this build
halves_constants:                  # frozen, measured on the complete-splits era 2023/2024–2025/2026 (n≈918)
  goals_1h_share: 0.450
  sot_1h_share: 0.443
  corners_1h_share: 0.454
  total_shots_1h_share: 0.447
  yellow_cards_1h_share: 0.346
markets:
  goals: G-DE2        # DC reference; arms: Gate Zero, SHRINK (thin-data prior), X2 mover (direction-specific), X3 set-play (on SHRINK)
  sot: S-DE2          # v5 reference; arms: Gate Zero, RS ratio-shrink, X4 xG/shot (X6 dropped on reliability)
  corners: C-DE2      # corners_v3 reference; arms: Gate Zero (X9), X7 box touches; primary line 10.5
  cards: K-DE2        # cards reference; arms: Gate Zero, X8 referee; primary line 4.5
