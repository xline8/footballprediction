# AT-Bundesliga (Austria) — league config
league: AT-Bundesliga
country: Austria
fotmob_id: 38
tier: 1
warehouse: data_enrichment/fotmob_world/Austria/Bundesliga
data:
  matches: league/AT-Bundesliga/data/at_matches.csv
  team_matches: league/AT-Bundesliga/data/at_team_matches.csv
seasons: ["2021/2022", "2022/2023", "2023/2024", "2024/2025", "2025/2026", "2026/2027"]
dev_period: ["2022/2023", "2023/2024", "2024/2025"]   # scored dev (2021/2022 = warm-up / initial training)
virgin_primary: "2025/2026"     # last complete season, n=195 — read ONCE per candidate
virgin_confirmatory: "2026/2027"  # in progress (n=72 at pull); reserved, never read in this build
halves_constants:               # frozen league constants (EDA F3) — the ONLY halves mechanism
  goals_1h_share: 0.448
  sot_1h_share: 0.447
  corners_1h_share: 0.476
  total_shots_1h_share: 0.454
  yellow_cards_1h_share: 0.316
markets:
  goals: G-AT        # DC reference; arms: Gate Zero, thin-team shrinkage, X3 set-play tilt
  sot: S-AT          # v5 reference; arms: Gate Zero, ratio-shrink, X4 xG/shot
  corners: C-AT      # corners_v3 reference; arms: Gate Zero (X9), X7 box touches
  cards: K-AT        # cards reference; arms: Gate Zero, X8 referee covariate
  total_shots: T-AT  # shots family; arms: v1 pattern, E9 trailing-r
notes:
  - Format: 12 teams; rounds 1-22 regular, rounds 23-32 championship/relegation split, plus European play-off ties (15 matches in corpus). Split/playoff matches are real league matches and stay in every window, flagged by the phase column.
  - FT stats, xG and shotmap are 100% in every season; period splits complete from 2023/2024.
  - Predictions-only: no AT-Bundesliga odds/settlement source in-system.
