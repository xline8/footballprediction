[project]
name = "football-data"
version = "0.1.0"
description = "Pipeline prediksi hasil pertandingan sepakbola (1X2 / O/U / AH / corner)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["raw", "xg_raw", ".cache", "eda", "ledger", "ta"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
