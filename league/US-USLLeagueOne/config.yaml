notes:
  - Calendar-year seasons; playoff rows are retained and phase-flagged but excluded from every fitting/scoring window.
  - Cards: stats-feed yellows are broken in 2021-22 and event cards are absent in 2021-25; valid target is stats yellows from 2023 when the key is present.
