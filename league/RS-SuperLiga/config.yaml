notes:
  - Split season (Jul - late May / early Jun), 18 teams 2021/2022-2022/2023, 16 teams from 2023/2024. Format per season from general.leagueName + matchRound: regular 240 + Championship Group 28 + Relegation Group 28 (+ Qualification 4 in 2021/2022-2022/2023 only — cross-tier relegation play-off ties vs Prva Liga clubs, EXCLUDED from fitting, halves, and X2; they stay in rs_matches.csv with phase=qualification). Phase rule frozen: all league-member phases are ordinary rows with a phase flag.
