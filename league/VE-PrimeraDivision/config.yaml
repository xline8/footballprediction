halves_constants:
  source: regular matches only; ratio of summed first-half values to summed full-match values
  goals: {source: Goal events, seasons: 2021-2025, exclude_awarded: true, n: 947, share: 0.4478293983}
  ShotsOnTarget: {source: stats period splits, stats-era regular, n: 243, share: 0.4651384909}
