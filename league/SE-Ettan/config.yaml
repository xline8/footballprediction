notes:
  - Split seasons, 32 teams, 480 matches/season (two independent groups, Ettan Norra / Ettan Södra, 16 teams each, 30 rounds; no cross-group matches in the feed, no group term fitted).
  - Index 2880 rows, but only 2662 played: 218 fixtures in 2021 were never played (finished=false, no scoreStr; index carries placeholder score "0-0" — Norra 95, Södra 123; rounds 1-12 heaviest, 136/192 unplayed). CSV-vs-raw played-match counts agree in every season (2021 262, 2022-2025 480 each).
  - No xG and no shotmap in ANY season -> X1 blend falls back goals-only; X3/X4/X6 impossible by data absence. Stats feed 0% in every season — the stats era never starts (unlike QA, where it starts in the virgin season).
  - One score-vs-events mismatch: match 4398485 (awarded 0-3, events 3-1), excluded from the halves-goals share only.
  - Dev scored OU 2.5 over-rate 0.5833 (1.5: 0.791, 3.5: 0.340), home win rate 0.4313, draw rate 0.2097, home goals 1.6104 / away goals 1.3771 per match. Norra outscores Södra by ~0.3-0.5 goals/match in every season (format fact, not acted on).
  - Goals trait reliable: split-half r goals-for 0.562 (dev 2021-2024, n=57 teams) / 0.703 (scored window, n=49), goals-against 0.742 / 0.604.
  - 0 group switches between seasons; 5 team-name variants canonicalised by team id; all logic keyed by team id.
  - Referees: named in 0 matches in every season — X8 dropped on dev absence.
  - Predictions-only: no SE odds/settlement source in-system.
  - Outcome (Phase 6): G-SE FAIL at the dev gate — Gate Zero 1X2 LL 1.0625 / RPS 0.2354 / OU2.5 LL 0.7126 vs climatology 1.0596 / 0.2380 / 0.6834 and naive trailing-10 1.1268 / 0.2333 / 0.7426 (passes 3/6 legs; OU2.5 loses to climatology in all three dev seasons; mean predicted OU2.5 over-rate 0.5065 vs actual 0.5833). SHRINK identical (no team with 1-5 prior in-league matches in any scored season's training data; entrants n=0 at league-mean fallback in both arms). Virgin 2025 was NOT read; 2026 untouched; nothing ships. S/C/K/T not-buildable (see reports/*_SE_VERDICT.md).
