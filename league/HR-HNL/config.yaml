notes:
  - Split-year season (Aug - May), 10 teams, straight quadruple round-robin: 36 rounds, 180 matches/season, NO split or play-off phase in the feed. The 12->10 contraction predates the corpus (all seasons 10 ids).
  - League renamed mid-corpus: payload general.leagueName "1. Division" in 2021/2022, mixed in 2022/2023, "HNL" from 2023/2024. Recorded per row; no modelling effect.
  - Stats feed rich in ALL seasons (36 keys incl. yellow_cards/red_cards, big_chance); touches_opp_box partial before 2024/2025 (114/102/144 of 180). Period splits: none 2021/2022, 51/180 in 2022/2023, complete from 2023/2024; All = 1H + 2H exact for corners/SOT/shots (yellow_cards 24/655 mismatches).
  - No xG and no shotmap in ANY season -> X1 blend falls back goals-only; X3/X4/X6 impossible by data absence.
  - Cards artefact (EDA F6): early-era stats yellows defective (37.8% zero-yellow matches at stable fouls; 1H share 0.145) and the event feed carries NO yellow events before 2023/2024; rich-era sources agree (exact 78-85%, mean stats-events -0.13..-0.28). No unified target spans the required windows -> K-HR not built.
  - Referee names: 81/180 in 2021/2022, 149-177/180 after — coverage fine, but the strictness trait fails reliability here (split-half r = 0.239) -> X8 dropped on the number.
  - Team-name stability: 13 FotMob team ids; ids 10165 (NK Varazdin / NK Varaždin) and 187866 (Rudes / Rudeš) each carry two diacritic spellings. All logic keyed by team id.
  - Predictions-only: no HR odds/settlement source in-system.
