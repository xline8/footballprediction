  - "CARDS: stats-vs-events artefact present and era-flipped in BOTH dev and virgin — event feeds 2022/2023-2025/2026 publish NO plain-yellow events (unified mean ~0.05 vs stats 3.30-3.75). Frozen target = stats-feed yellow_cards in dev and virgin; no virgin event-unified sensitivity exists. Stats-card level in the seed season (2.23) is a recording shift vs scored seasons (3.75)."
  - "REFEREE: text coverage sparse in dev (82/69/62 per season) and 13/240 in the virgin; strictness split-half r=0.080 — X8 dropped on both legs."
  - "Calibration convention: actual minus predicted."
