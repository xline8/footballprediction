notes:
  - Index coverage flags are not trusted; payload content is measured.
  - There is no named referee, xG, lineup, period split, SOT, corners, total-shots, or stats yellow-card source.
  - Guatemala has no other warehouse league, so no X2 mover prior is available.
  - The builder includes every index row whose payload says header.status.finished=true; all 1,443 rows pass.
